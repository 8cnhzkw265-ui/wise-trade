<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 770" width="1800" height="770" role="img" aria-label="Workshop film poster">
<defs>
<linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1c17"/><stop offset="1" stop-color="#0c0e0a"/></linearGradient>
<radialGradient id="vglow" cx=".28" cy=".35" r=".55"><stop offset="0" stop-color="#d98a2b" stop-opacity=".4"/><stop offset="1" stop-color="#d98a2b" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1800" height="770" fill="url(#vbg)"/>
<rect width="1800" height="770" fill="url(#vglow)"/>
<!-- bench -->
<rect y="520" width="1800" height="250" fill="#241d13"/>
<rect y="520" width="1800" height="10" fill="#3a3126"/>
<!-- shelving -->
<g opacity=".22" stroke="#d9cba8" stroke-width="3" fill="none">
<rect x="120" y="120" width="300" height="180" rx="8"/>
<rect x="1380" y="140" width="280" height="170" rx="8"/>
<path d="M120 400h1560"/>
</g>
<!-- parts -->
<g opacity=".55">
<rect x="180" y="300" width="180" height="120" rx="14" fill="#2e322b"/>
<rect x="1460" y="330" width="150" height="90" rx="14" fill="#2e322b"/>
<circle cx="1120" cy="300" r="46" fill="none" stroke="#8f8a7a" stroke-width="8"/>
<circle cx="1230" cy="360" r="26" fill="#8f8a7a"/>
</g>
<!-- sparks / light rays -->
<g stroke="#f0c98a" stroke-width="4" stroke-linecap="round" opacity=".7">
<path d="M700 300l40-30M745 330l54-8M690 260l20-44"/>
</g>
<g fill="#f0c98a" opacity=".55">
<circle cx="820" cy="230" r="4"/><circle cx="880" cy="300" r="3"/><circle cx="760" cy="200" r="3"/>
</g>
<!-- vignette -->
<rect width="1800" height="770" fill="url(#vglow)" opacity=".3"/>
</svg>
