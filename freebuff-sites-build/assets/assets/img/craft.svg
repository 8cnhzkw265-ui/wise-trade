<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Assembling a charger on a workbench">
<defs>
<linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f2a20"/><stop offset="1" stop-color="#17140f"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f8a7a"/><stop offset="1" stop-color="#c9c4b6"/></linearGradient>
</defs>
<rect width="1000" height="750" fill="url(#cbg)"/>
<rect y="470" width="1000" height="280" fill="#3a3126"/>
<rect y="470" width="1000" height="12" fill="#4d4132"/>
<g opacity=".2" stroke="#d9cba8" stroke-width="2">
<path d="M0 560h1000M0 640h1000M200 470v280M500 470v280M800 470v280"/>
</g>
<!-- parts tray -->
<g transform="translate(60 500)">
<rect width="260" height="180" rx="12" fill="#241d13" stroke="#5a4c39" stroke-width="3"/>
<g fill="#9aa0a6"><rect x="26" y="34" width="60" height="26" rx="6"/><rect x="110" y="34" width="60" height="26" rx="6"/></g>
<circle cx="60" cy="120" r="20" fill="#8f8a7a"/><circle cx="120" cy="120" r="14" fill="#c9c4b6"/>
<rect x="160" y="100" width="70" height="12" rx="6" fill="#8f8a7a"/>
</g>
<!-- housing being assembled -->
<g transform="translate(400 300)">
<rect width="300" height="200" rx="34" fill="#1a1c18"/>
<rect x="16" y="16" width="268" height="168" rx="24" fill="#2e322b"/>
<g fill="#0f4c33"><rect x="44" y="50" width="212" height="14" rx="7"/></g>
<g fill="#c9c4b6"><circle cx="60" cy="140" r="8"/><circle cx="120" cy="140" r="8"/><circle cx="180" cy="140" r="8"/><circle cx="240" cy="140" r="8"/></g>
<path d="M250 -30l0 40" stroke="#c9c4b6" stroke-width="12" stroke-linecap="round"/>
<path d="M250 -46l0 0" stroke="#c9c4b6" stroke-width="12" stroke-linecap="round"/>
</g>
<!-- hands -->
<g opacity=".92">
<path d="M330 380c-30 30-40 70-20 100 22 32 70 30 96 4l40-42z" fill="#c8a887"/>
<path d="M676 384c30 30 40 68 20 98-22 32-70 30-96 4l-40-42z" fill="#c8a887"/>
<path d="M400 300l40 40 30-30-40-40z" fill="#b8976f"/>
</g>
<!-- caliper -->
<g transform="translate(760 560) rotate(-12)">
<rect width="180" height="14" rx="7" fill="#b6bcc2"/>
<rect x="150" y="-26" width="12" height="52" rx="5" fill="#b6bcc2"/>
<rect x="30" y="-20" width="12" height="46" rx="5" fill="#b6bcc2"/>
<rect x="0" y="-4" width="60" height="10" rx="4" fill="#8f959b"/>
</g>
<g opacity=".5" fill="#d9cba8">
<circle cx="120" cy="120" r="4"/><circle cx="900" cy="160" r="3"/><circle cx="840" cy="240" r="5"/>
</g>
</svg>
